app = "mkuzmik-train-with-gpt"
primary_region = "fra"

[build]

[env]
  PORT = "8000"
  PUBLIC_URL = "https://mkuzmik-train-with-gpt.fly.dev"
  TRAINING_REPO_PATH = "/data/training-context"
  TRAINING_REPO_URL = "git@github.com:mkuzmik/training-context-shared.git"

# Persists store.db (OAuth clients/tokens/users). Secrets (STRAVA_CLIENT_ID,
# STRAVA_CLIENT_SECRET, TRAINING_CONTEXT_DEPLOY_KEY) are set via `fly secrets`.
[mounts]
  source = "train_with_gpt_data"
  destination = "/home/app/.config/train-with-gpt"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
