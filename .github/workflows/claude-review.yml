name: Claude review

# Reviews every non-draft PR: when it's opened or reopened, marked ready for
# review, and on every push to it. The prompt lives in
# .github/claude-review-prompt.md. Needs the Claude GitHub App installed on the
# repo and a CLAUDE_CODE_OAUTH_TOKEN secret (see README → Continuous Integration).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# A new push cancels the review still running for the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Take the prompt from the base branch so a PR can't rewrite its own
      # review instructions. Fall back to the PR's copy only when the base
      # branch doesn't have the file yet (the PR that adds it).
      - name: Load review prompt
        id: prompt
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PROMPT_FILE: .github/claude-review-prompt.md
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! prompt="$(git show "FETCH_HEAD:$PROMPT_FILE" 2>/dev/null)"; then
            echo "::notice::$PROMPT_FILE not on $BASE_REF yet, using the PR's copy"
            prompt="$(cat "$PROMPT_FILE")"
          fi
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            echo "$prompt"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.prompt.outputs.text }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
