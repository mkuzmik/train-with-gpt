name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Also run by release.yml on every release tag.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        # Keep in sync with the uv image pinned in the Dockerfile.
        version: "0.11.17"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Check uv.lock is up to date
      run: uv lock --check

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run unit tests
      run: uv run --frozen pytest tests/unit -v --tb=short

    - name: Run integration tests
      run: uv run --frozen pytest tests/integration -v --tb=short

    - name: Test CLI tool
      run: uv run --frozen python test_tools.py --help
