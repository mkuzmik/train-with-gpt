[project]
name = "train-with-gpt"
version = "0.1.0"
description = "MCP server for training analysis and coaching suggestions (backed by intervals.icu)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "respx>=0.21.0",
    "responses>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
train-with-gpt = "train_with_gpt.server:main"
train-with-gpt-http = "train_with_gpt.http_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
